[project]
name = "webscout-ai"
version = "0.1.0"
description = "Bounded evidence-first web retrieval with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "beautifulsoup4>=4.13,<5", "lxml>=5.3,<7",
  "langgraph>=1,<2", "langchain>=1,<2", "langchain-openai>=1,<2",
  "langchain-google-genai>=4,<5", "playwright>=1.50,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires explicit opt-in and external services"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
